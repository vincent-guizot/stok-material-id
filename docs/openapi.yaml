openapi: 3.0.3
info:
  title: StokMaterial.id API
  version: 1.0.0
  description: Lihat API_CONTRACT.md untuk contoh respons lengkap.
servers:
  - url: http://localhost:5000/api/v1
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Envelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
        meta: { type: object }
paths:
  /auth/login:
    post:
      summary: "Login; mengembalikan JWT"
      description: "Akses: publik. body: username*, password*"
      responses:
        "200": { description: Sukses, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "400": { description: Validasi gagal }
        "401": { description: Tidak terautentikasi }
        "403": { description: Peran tidak diizinkan }
  /auth/register:
    post:
      summary: "Buat akun (juga lewat /users)"
      security: [{ bearer: [] }]
      description: "Akses: admin. body: name*, username*, password*(min 6), role(admin|cashier|warehouse)"
      responses:
        "200": { description: Sukses, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "400": { description: Validasi gagal }
        "401": { description: Tidak terautentikasi }
        "403": { description: Peran tidak diizinkan }
  /auth/me:
    get:
      summary: "Profil pengguna aktif"
      security: [{ bearer: [] }]
      description: "Akses: semua peran (login)."
      responses:
        "200": { description: Sukses, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "400": { description: Validasi gagal }
        "401": { description: Tidak terautentikasi }
        "403": { description: Peran tidak diizinkan }
  /auth/password:
    put:
      summary: "Ganti kata sandi sendiri"
      security: [{ bearer: [] }]
      description: "Akses: semua peran (login). body: currentPassword*, newPassword*(min 6, ≠ lama)"
      responses:
        "200": { description: Sukses, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "400": { description: Validasi gagal }
        "401": { description: Tidak terautentikasi }
        "403": { description: Peran tidak diizinkan }
  /settings:
    get:
      summary: "Pengaturan toko (nama, pajak, struk, allowMinusStock, logoUrl, dst.)"
      description: "Akses: publik."
      responses:
        "200": { description: Sukses, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "400": { description: Validasi gagal }
        "401": { description: Tidak terautentikasi }
        "403": { description: Peran tidak diizinkan }
    put:
      summary: "Ubah pengaturan (POST setara)"
      security: [{ bearer: [] }]
      description: "Akses: admin. body: field pengaturan; perubahan pajak ditolak bila sudah ada transaksi (guardTaxChange)"
      responses:
        "200": { description: Sukses, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
